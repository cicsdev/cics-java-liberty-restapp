plugins
{
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'war'

}

group = 'com.ibm.cicsdev'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version)
    }
}

war
{
    archiveFileName = 'cics-java-liberty-restapp.war'
}

// If in Eclipse, add Javadoc to the local project classpath
eclipse
{
    classpath
    {
        downloadJavadoc = true
    }
}


repositories 
{
    mavenCentral()
}


dependencies 
{      
    // CICS TS V5.5 Maven BOM
    compileOnly enforcedPlatform("com.ibm.cics:com.ibm.cics.ts.bom:5.5-20250513205735-PH63882")

    // Don't include JCICS in the final build (no need for version because we have BOM)
    compileOnly("com.ibm.cics:com.ibm.cics.server") 

    // Compile against, but don't include JAXRS in the final build 
    // https://mvnrepository.com/artifact/javax.ws.rs/javax.ws.rs-api   
    compileOnly ("javax.ws.rs:javax.ws.rs-api:2.0")



    //JAXB required if compiling with Java 11 or later
    compileOnly ("javax.xml.bind:jaxb-api:2.3.1")
}


